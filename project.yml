name: Myotect
options:
  bundleIdPrefix: com.myotect
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
packages:
  DevicePpi:
    url: https://github.com/Clafou/DevicePpi
    exactVersion: 1.2.25
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 0.18.0
targets:
  Myotect:
    type: application
    platform: iOS
    sources:
      # Exclude the bundled Whisper model from the default glob; it is added below as a folder
      # reference so its directory hierarchy (WhisperModels/openai_whisper-base/...) is preserved
      # in the app bundle instead of being flattened into the bundle root.
      - path: Sources
        excludes:
          - "Resources/WhisperModels/**"
      # Blue folder reference: copied verbatim into the bundle, hierarchy intact.
      - path: Sources/Resources/WhisperModels
        type: folder
    dependencies:
      - package: DevicePpi
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myotect.Myotect
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Myotect
        INFOPLIST_KEY_NSCameraUsageDescription: "Used to measure your viewing distance with the front camera during the vision screening. No video is recorded."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used so you can say the letters you see out loud. Audio is not saved."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  MyotectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Myotect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myotect.MyotectTests
schemes:
  Myotect:
    build:
      targets:
        Myotect: all
        MyotectTests: [test]
    test:
      targets:
        - MyotectTests
      gatherCoverageData: false
